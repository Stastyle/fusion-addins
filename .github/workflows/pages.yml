name: Build and publish the add-in page

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *" # every day, 05:17 Israel time
  workflow_dispatch:
  repository_dispatch:
    types: [addin-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build the page from repos tagged fusion-addin
        run: node scripts/build.mjs
        env:
          # CATALOG_TOKEN is optional: a personal token, needed only to list private repos.
          GITHUB_TOKEN: ${{ secrets.CATALOG_TOKEN || secrets.GITHUB_TOKEN }}
          INCLUDE_PRIVATE: ${{ secrets.CATALOG_TOKEN && '1' || '0' }}
          OWNER: ${{ github.repository_owner }}
          SCAN_UNTAGGED: "1"

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
