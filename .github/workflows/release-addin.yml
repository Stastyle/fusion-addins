# Reusable workflow, called from an add-in repo when a version tag (v*) is pushed or a release
# is published in GitHub's web page. Zips the add-in folder (the one holding the .manifest),
# takes the release notes from CHANGELOG.md, and creates or completes the GitHub release.
# Re-running it updates the release in place.
name: Release a Fusion add-in

on:
  workflow_call:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: Stastyle/fusion-addins
          path: .release-tools
          sparse-checkout: scripts/release_addin.py
          sparse-checkout-cone-mode: false

      - name: Package the add-in
        id: pack
        env:
          TAG: ${{ github.ref_name }}
        run: python3 .release-tools/scripts/release_addin.py

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          ZIP: ${{ steps.pack.outputs.zip }}
          TITLE: ${{ steps.pack.outputs.title }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            # The release was made in GitHub's web page: keep any title and notes typed there.
            name=$(gh release view "$TAG" --json name --jq .name)
            body=$(gh release view "$TAG" --json body --jq .body)
            if [ -z "$name" ] || [ "$name" = "$TAG" ]; then gh release edit "$TAG" --title "$TITLE"; fi
            if [ -z "$body" ]; then gh release edit "$TAG" --notes-file release-notes.md; fi
            gh release upload "$TAG" "$ZIP" --clobber
          else
            gh release create "$TAG" "$ZIP" --title "$TITLE" --notes-file release-notes.md --verify-tag
          fi
          echo "Released [$TITLE](${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG) with $ZIP" >> "$GITHUB_STEP_SUMMARY"
